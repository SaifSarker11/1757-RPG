name: vercel-diagnose
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.VERCEL_TOKEN }}
          O: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          curl -s -H "Authorization: Bearer $T" "https://api.vercel.com/v9/projects?teamId=$O&limit=50" | jq -r '.projects[] | "\(.name) \(.id) root=\(.rootDirectory) repo=\(.link.repo // "none") branch=\(.link.productionBranch // "-")"'
          echo ---aliases
          curl -s -H "Authorization: Bearer $T" "https://api.vercel.com/v4/aliases/1757-web-rpg.vercel.app?teamId=$O" | jq -c '{alias,projectId,deploymentId}'
          for p in $(curl -s -H "Authorization: Bearer $T" "https://api.vercel.com/v9/projects?teamId=$O&limit=50" | jq -r '.projects[].id'); do
            echo "domains $p: $(curl -s -H "Authorization: Bearer $T" "https://api.vercel.com/v9/projects/$p/domains?teamId=$O" | jq -rc '[.domains[].name]')"
            echo "protection $p: $(curl -s -H "Authorization: Bearer $T" "https://api.vercel.com/v9/projects/$p?teamId=$O" | jq -c '.ssoProtection')"
          done
