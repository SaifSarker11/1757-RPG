# =============================================================================
# Render Blueprint — https://render.com/docs/blueprint-spec
# Declares the API and web services and their environment for one-click
# deploys. Both build from Dockerfiles in /code; env vars marked `sync: false`
# are set by hand in the dashboard the first time.
# =============================================================================

services:
  - type: web
    name: 1757-api
    runtime: docker
    # No rootDir: both paths resolve from the repo root, where the monorepo
    # sits in /code. The build filter skips deploys for /doc-only changes.
    dockerfilePath: ./code/Dockerfile
    dockerContext: ./code
    buildFilter:
      paths:
        - code/**
    region: singapore
    plan: free                     # switch to starter to avoid cold starts
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        sync: false                # Set manually in Render dashboard
      - key: DIRECT_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true        # Render auto-generates a random secret
      - key: BETTER_AUTH_URL
        sync: false
      - key: WEB_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      - key: ADMIN_USER_IDS         # comma-separated user IDs allowed into the admin console
        sync: false
      - key: EXTRA_ALLOWED_ORIGINS  # optional extra web origins (comma-separated)
        sync: false

  # ---------------------------------------------------------------------------
  # The game itself, served from Render. A second copy of the site next to the
  # Vercel one — both talk to the API above and share the same database.
  # The browser only ever calls this origin: next.config.ts rewrites /api/* and
  # /rooms* to the API, so the session cookie stays same-origin.
  # ---------------------------------------------------------------------------
  - type: web
    name: 1757-web
    runtime: docker
    dockerfilePath: ./code/Dockerfile.web
    dockerContext: ./code
    buildFilter:
      paths:
        - code/apps/web/**
        - code/packages/game-engine/**
        - code/Dockerfile.web
        - code/pnpm-lock.yaml
    region: singapore
    plan: free                     # switch to starter to avoid cold starts
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # The API address, the live-connection address and this site's canonical
      # URL are compiled into the image, so they live as ARG defaults at the top
      # of code/Dockerfile.web rather than here — Render does not pass service
      # env vars into a Docker build. Change them there and redeploy.
