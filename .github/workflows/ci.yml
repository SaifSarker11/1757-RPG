name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    # The monorepo lives in /code; the repo root only holds docs and deploy config.
    defaults:
      run:
        working-directory: code
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: code/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - name: Run Vitest suites (game engine and API)
        run: pnpm test
      - name: Publish test counts to the run summary
        if: always()
        run: node scripts/test-summary.mjs
      - name: Upload Vitest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: |
            code/packages/game-engine/test-results/
            code/apps/api/test-results/
          if-no-files-found: error
          retention-days: 30
      - run: pnpm build

  deploy-api:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: code/pnpm-lock.yaml

      - name: Apply database schema (additive changes such as new roles)
        working-directory: code
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then echo "DIRECT_URL not set; skipping schema push."; exit 0; fi
          pnpm install --frozen-lockfile
          cd packages/db && npx prisma db push

      - name: Trigger Render deploy
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_SERVICE_ID" ] || [ -z "$RENDER_API_KEY" ]; then
            echo "Render secrets not set: Render's own autoDeploy (render.yaml) handles it. Skipping."
            exit 0
          fi
          curl --fail-with-body -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'

  deploy-web:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Deploy web (apps/web) to Vercel
        # Run from the repo root: the Vercel project's Root Directory setting
        # (code/apps/web) is applied on top of the current folder.
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Vercel secrets not set: use Vercel's Git integration instead. Skipping."
            exit 0
          fi
          url=$(vercel --prod --yes --token="$VERCEL_TOKEN")
          echo "Deployed $url"
          # Promote explicitly: after an Instant Rollback, Vercel keeps the production domain
          # pinned to the old deployment and new --prod builds no longer take it over.
          vercel promote "$url" --yes --token="$VERCEL_TOKEN" || echo "Already the production deployment."

  deploy-admin:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Create or find the admin Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "VERCEL_TOKEN not set, skipping"; exit 0; fi
          api="https://api.vercel.com"; q="teamId=$VERCEL_ORG_ID"; auth="Authorization: Bearer $VERCEL_TOKEN"
          id=$(curl -s -H "$auth" "$api/v9/projects/1757-admin?$q" | jq -r '.id // empty')
          if [ -z "$id" ]; then
            id=$(curl -s -X POST -H "$auth" -H "Content-Type: application/json" "$api/v10/projects?$q" \
              -d '{"name":"1757-admin","framework":"nextjs","rootDirectory":"code/apps/admin"}' | jq -r '.id')
          fi
          echo "Admin project: $id"
          curl -s -X POST -H "$auth" -H "Content-Type: application/json" "$api/v10/projects/$id/env?$q&upsert=true" \
            -d '{"key":"API_URL","value":"https://one757-rpg.onrender.com","type":"plain","target":["production","preview"]}' >/dev/null
          curl -s -X PATCH -H "$auth" -H "Content-Type: application/json" "$api/v9/projects/$id?$q" \
            -d '{"ssoProtection":null}' >/dev/null
          curl -s -X POST -H "$auth" -H "Content-Type: application/json" "$api/v10/projects/$id/domains?$q" \
            -d '{"name":"1757-admin-rpg.vercel.app"}' | jq -c '{name, error}'
          echo "VERCEL_PROJECT_ID=$id" >> "$GITHUB_ENV"

      - name: Deploy admin (apps/admin) to Vercel
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then echo "skipping admin deploy"; exit 0; fi
          url=$(vercel --prod --yes --token="$VERCEL_TOKEN")
          echo "Deployed: $url"
          vercel promote "$url" --yes --token="$VERCEL_TOKEN" || echo "Already the production deployment."
